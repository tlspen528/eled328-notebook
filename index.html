<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELED 328 • Lesson Planning Notebook</title>
<style>
:root{--ink:#172b38;--teal:#126b67;--paper:#fff;--line:#d5e2e2;--muted:#506570}*{box-sizing:border-box}body{margin:0;background:#eff4f3;color:var(--ink);font:16px/1.55 system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 14px;background:white;color:var(--ink)}button:hover{border-color:var(--teal)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #da9b27;outline-offset:2px}.primary{background:var(--teal);color:white;border-color:var(--teal)}header{background:#173e49;color:white;padding:25px 32px}header p{margin:4px 0;color:#d2e9e5}h1{font-size:27px;margin:0}h2{font-size:26px;line-height:1.2;margin:8px 0 12px}h3{font-size:19px;margin:0 0 8px}.shell{display:grid;grid-template-columns:240px minmax(0,900px);max-width:1200px;margin:auto;gap:24px;padding:25px}aside{align-self:start;position:sticky;top:15px}.nav{display:grid;gap:5px;margin:18px 0}.nav button{text-align:left;background:transparent;border-color:transparent}.nav button[aria-current=step]{background:var(--teal);color:white;font-weight:700}.nav button small{display:block;font-size:11px}.meter{height:8px;background:#d2dfdd;border-radius:9px;overflow:hidden}.meter span{display:block;height:100%;background:var(--teal)}.small{font-size:13px;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:18px}.callout{border-left:4px solid #dc9f32;background:#fff8e7;padding:14px 18px;margin:16px 0}.tip{background:#edf7f5;border-radius:8px;padding:14px 18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin:18px 0}label{display:block;font-weight:650;margin-bottom:6px}input:not([type=checkbox]),select,textarea{width:100%;background:#fcfdfd;border:1px solid #a9bfc2;border-radius:7px;padding:10px;color:var(--ink)}textarea{min-height:125px;resize:vertical}textarea.long{min-height:220px}.hint{font-size:14px;color:var(--muted);margin:4px 0 9px}.counter{text-align:right;font-size:13px;color:#875400;margin:4px 0}.counter.ok{color:#126b52}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.bottom{display:flex;justify-content:space-between;gap:15px;margin:24px 0}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:650}.check{display:flex;align-items:flex-start;gap:10px;margin:12px 0;font-weight:400}.check input{margin-top:6px;accent-color:var(--teal)}.badge{display:inline-block;background:#e4efee;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.05em}.status{min-height:22px;font-size:13px;color:var(--muted)}ul{padding-left:22px}li{margin:7px 0}.issue{padding:10px 0;border-bottom:1px solid var(--line)}.issue button{padding:3px 9px;margin-right:9px;font-size:13px}.printout{display:none}table{width:100%;border-collapse:collapse}td,th{padding:9px;border:1px solid var(--line);text-align:left}.screenreader{position:absolute;left:-9999px}@media(max-width:760px){.shell{display:block;padding:14px}aside{position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}header{padding:20px}.card{padding:20px}.grid{grid-template-columns:1fr}}@media print{body{background:white;font:11pt/1.4 serif}header,.shell{display:none}.printout{display:block}.printout h1{font-size:22pt}.printout h2{font-size:17pt;margin-top:24px;break-after:avoid}.printout h3{font-size:12pt;break-after:avoid}.printout p{white-space:pre-wrap;overflow-wrap:anywhere}.printout section{break-inside:auto}.printout .answer{border-bottom:1px solid #ccc;padding-bottom:8px}}
</style></head><body>
<header><div class="badge" style="color:#173e49">ELED 328 · STUDENT WORKBOOK</div><h1>Build a lesson with purpose.</h1><p>A guided notebook for the Standards-Aligned Lesson Plan Assignment</p></header>
<div class="shell"><aside><b>Your planning journey</b><p class="small" id="progressText"></p><div class="meter" role="progressbar" aria-label="Required response completion" aria-valuemin="0" aria-valuemax="100"><span id="progressBar"></span></div><nav class="nav" id="nav" aria-label="Notebook sections"></nav><div class="actions"><button id="backup">Save backup</button><button id="restore">Open backup</button></div><div class="actions"><button id="print">Print / PDF</button><button id="textExport">Export responses</button></div><input type="file" id="file" accept=".json,application/json" hidden><p class="small">Drafts may be stored in this browser. Save a backup after each class and before switching devices. Use fictional or de-identified learner profiles.</p><div id="saveStatus" class="status" role="status"></div></aside><main><div id="page"></div><div class="bottom"><button id="prev">← Previous</button><button id="next" class="primary">Next →</button></div></main></div><article class="printout" id="printout"></article>
<script>
const KEY='eled328-notebook-v1';
const stages=[['Start','Purpose & class process'],['Focus','Approval checkpoint'],['Align','Standards → evidence'],['Learners','Remove learning barriers'],['Opening','Engage & connect'],['Modeling','Make thinking visible'],['Guided practice','Support & check'],['Application','Apply the learning'],['Closure','Gather final evidence'],['Review','Revise & transfer']];
let data={},current=0,storageOK=true;try{data=JSON.parse(localStorage.getItem(KEY)||'{}');if(!data||typeof data!=='object'||Array.isArray(data))data={}}catch(e){data={};storageOK=false}
const fields=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=s=>(String(s||'').match(/\S+/g)||[]).length;
function f(id,label,hint='',opts={}){if(!fields.some(x=>x.id===id))fields.push({id,label,page:current,min:opts.min||0,required:opts.required!==false});const val=esc(data[id]);return `<div class="field"><label for="${id}">${label}${opts.min?' · 50-word minimum':''}</label>${hint?`<p class="hint" id="${id}-hint">${hint}</p>`:''}${opts.input?`<input id="${id}" data-field="${id}" value="${val}" ${hint?`aria-describedby="${id}-hint"`:''}>`:`<textarea id="${id}" data-field="${id}" class="${opts.min?'long':''}" ${hint?`aria-describedby="${id}-hint"`:''}>${val}</textarea>`}${opts.min?`<div class="counter" id="${id}-count"></div>`:''}</div>`}
function ck(id,label){return `<label class="check"><input type="checkbox" data-field="${id}" ${data[id]===true?'checked':''}><span>${label}</span></label>`}
function heading(n,title,sub){return `<div class="card"><span class="badge">${n}</span><h2 tabindex="-1">${title}</h2><p>${sub}</p>`}
function end(){return '</div>'}
function content(p){switch(p){
case 0:return heading('BEGIN HERE','Think like an instructional planner.','Create one realistic lesson for an elementary, middle school, or special education classroom. Connect the standard, objectives, instruction, assessment, learner supports, and engagement.')+`<div class="callout"><b>Required class process</b><br>Your lesson focus must be approved by Dr. Spencer before you begin developing the lesson plan. Start and develop your plan in class under her direction. Work completed entirely outside class without the guided planning process will not be accepted.</div><h3>What you will learn to do</h3><ul><li>Align standards, objectives, instruction, and assessment.</li><li>Write measurable objectives and student-friendly learning targets.</li><li>Design activities that actively engage students.</li><li>Plan differentiation, accommodations, and supports.</li><li>Use assessment evidence to judge learning.</li></ul><div class="tip"><b>How to use this notebook</b><br>Move through the tabs during guided class work. Record feedback and revise. Each teacher action response and each student action response in Opening, Modeling, Guided Practice, and Application must contain at least <b>50 words</b>: eight responses, totaling at least 400 words. Other fields have no assigned word minimum. Word counts check length, not instructional quality.</div>`+f('name','Student name','',{input:true})+f('field','Intended teaching field','Elementary, middle school, or special education; add your content focus.',{input:true})+f('classlog','Guided class planning record','Record the class date, section developed, feedback received, and revision made. Add an entry each time you work in class. This is your record; it does not verify attendance.')+end();
case 1:return heading('STEP 1','Select a focused lesson.','Choose a lesson that fits one instructional period and aligns with your intended teaching field.')+`<div class="grid">`+f('grade','Grade level','',{input:true})+f('subject','Subject / content area','',{input:true})+'</div>'+f('topic','Specific lesson topic','What concept or skill will students learn? Narrow a broad unit topic to one teachable focus.',{input:true})+f('duration','Total lesson time in minutes','Use this total when allocating time across the five instructional phases.',{input:true})+f('focuswhy','Why this focus fits','Explain how the topic fits your teaching field, selected grade, likely prior knowledge, and one instructional period.')+`<div class="callout"><b>Stop for approval.</b> Share your grade, content area, topic, proposed standard, and scope with Dr. Spencer before developing the plan. The next tab includes space to record the standard.</div>`+ck('approved','I have received Dr. Spencer’s approval for this lesson focus.')+f('approvalnote','Approval date and feedback','Record the actual approval date and any conditions or revisions. Until approved, enter “Awaiting approval.” A checked box is a student record, not instructor verification.')+end();
case 2:{let s=heading('STEPS 2–3','Build the alignment chain.','Select an appropriate Virginia SOL, VESOL, or other approved standard. Write one to three measurable objectives and plan assessments that directly measure them.')+f('standardtype','Standard framework / subject / edition','Identify SOL, VESOL, or another approved framework, including the relevant subject and edition/year.',{input:true})+f('standard','Standard identifier and exact wording','Copy the relevant standard and identify the portion addressed in this lesson. Verify the current applicable standard with your course materials or an official source.')+f('source','Standard source','Record the official source URL or approved course reference.',{input:true})+`<div class="tip"><b>Objective builder:</b> Given [conditions/materials], students will [observable action and content] with [success criterion]. Avoid “understand” or “learn” alone.<br><b>Illustrative objective:</b> Given a map and a short text, students will explain two ways a river influenced settlement, using one supporting detail for each explanation. This example does not identify a specific SOL.</div>`;
for(let i=1;i<=3;i++)s+=`<details ${i===1?'open':''}><summary>Objective ${i}${i>1?' · optional':''}</summary>`+f('obj'+i,'Measurable objective '+i,'Name what students will do and what counts as success.',{required:i===1})+f('target'+i,'“I can…” learning target '+i,'Keep the thinking demand of the objective in student-friendly language.',{required:i===1})+f('assessment'+i,'Assessment evidence and success criteria '+i,'Describe the actual task, response, or product you will examine. Explain what accurate or successful work will show.',{required:i===1})+f('activity'+i,'Instruction aligned to objective '+i,'Identify where students learn and practice the same skill and content that the assessment measures.',{required:i===1})+'</details>';
return s+f('formative','Formative assessment and instructional response','Include at least one formative check: when will it occur, how will you gather evidence from every student, and how will you respond if students need more support or are ready to extend?')+`<details><summary>Try the alignment test</summary><p>If the objective asks students to explain, an assessment that asks only for labels is insufficient. Ask: does my assessment require the same action, content, and level of thinking? Does instruction prepare students for that task?</p></details>`+end()}
case 3:{let s=heading('STEP 4','Plan for learners and barriers.','Use a realistic, de-identified classroom description. Plan supports that help students access and demonstrate the intended learning.')+f('profile','Classroom learner profile','Describe relevant prior knowledge, interests, cultural and linguistic backgrounds, strengths, and learning needs. Consider students with IEPs or 504 Plans, multilingual learners, students needing academic support, and advanced learners. Do not enter names or confidential records.')+`<div class="tip"><b>Make the support specific:</b> “Provide a labeled visual word bank and oral rehearsal before the written explanation so multilingual learners can express causal relationships.” Explain the barrier, support, and benefit. An accommodation changes access or response conditions; a modification changes what is expected to be learned. Follow identified plans and approved standards.</div>`;
for(let i=1;i<=3;i++)s+=f('support'+i,'Learner support plan '+i+(i===1?'':' · optional'),'Identify a learner need or group → instructional barrier → specific scaffold, accommodation, modification, or enrichment → phase where used → how it helps → evidence you will monitor.',{required:i===1});
return s+f('participation','Equitable participation plan','How will every student have time and a way to think, respond, discuss, create, solve, or apply? Explain how you will notice whose thinking has not yet been heard.')+end()}
case 4:return phase('STEP 5A','Opening / Engagement','Gain attention, activate prior knowledge, connect to students’ experiences, and introduce the objective or learning target.','opening','What prompt, image, question, object, or task will you use? Describe your sequence, connections to prior learning, how you introduce the target, and how you invite responses from all learners.','What will students observe, recall, think, say, write, or do? Describe how their responses reveal prior knowledge and how they connect the opening to the learning target.','Choose an opening that launches the intended content. Explain why it will engage these students and prepare them for the objective.');
case 5:return phase('STEP 5B','Instruction and Modeling','Teach the concept or skill explicitly and make the thinking process visible. Include at least two questions that prompt meaningful reasoning.','model','What will you explain, demonstrate, or model? Describe examples, a think-aloud, key vocabulary, likely misconceptions, and the learner supports you will use.','What will students attend to, annotate, explain, compare, question, or discuss? Explain how their responses demonstrate thinking about the modeled concept or skill.','Explain why the model and examples are appropriate for these learners and the objective.')+`<div class="card"><h3>Questions that deepen thinking</h3>`+f('question1','Reasoning question 1','Ask students to explain, analyze, apply, justify, compare, or connect. Avoid a recall-only question.')+f('question2','Reasoning question 2','Use a different reasoning demand or invite students to extend their thinking.')+f('questionfollow','Evidence and follow-up','What reasoning would a strong answer show? How will you give all students processing time, probe an incomplete answer, and address misconceptions?')+end();
case 6:return phase('STEP 5C','Guided Practice','Let students practice the same skill or concept with teacher support. Gather evidence before releasing responsibility.','guided','Describe the practice task, prompts, feedback, scaffolds, and how you will check every student’s understanding. Explain how evidence will guide reteaching or the move to independent work.','Describe what students practice, how they use feedback and supports, and what they produce or say to show readiness. Make the thinking demand and individual participation clear.','Explain why this support prepares students for application. Identify what evidence will trigger another model, small-group support, or greater independence.');
case 7:return phase('STEP 5D','Student Application','Have students apply the objective independently or collaboratively through an appropriate task.','apply','Explain how you will launch the task, provide materials and access supports, monitor learning, and collect evidence. If students work together, explain how you will see each student’s learning.','Describe how students solve, discuss, investigate, create, write, or otherwise apply the learning. Identify the product or response, success criteria, and how they demonstrate their own understanding.','Explain why this task suits the grade, content, learner profile, and objective. How does it require active thinking?');
case 8:return heading('STEP 6','Close with evidence.','Bring students back to the learning target and gather final evidence of understanding.')+f('closuretime','Closure time in minutes','',{input:true})+f('closureteacher','Closure: teacher actions','Describe your summary prompt or task, how you revisit the target, how you gather responses, and how you interpret them.')+f('closurestudent','Closure: student actions','Explain how students summarize, demonstrate, reflect on, or connect their learning. Identify what students will say, create, or submit.')+f('nextsteps','Use the evidence','What evidence will show the objectives were met? What will you do next for students who need reteaching, continued practice, or enrichment?')+end();
case 9:return review();}}
function phase(step,title,intro,id,teacher,student,why){return heading(step,title,intro)+f(id+'time',title+': time in minutes','Allocate time so all five phases fit your instructional period.',{input:true})+f(id+'teacher',title+': teacher actions',teacher,{min:50})+f(id+'student',title+': student actions',student,{min:50})+f(id+'why',title+': instructional rationale',why)+end()}
const checks=[['allsections','I completed every section of the Canvas lesson plan template.'],['alignmentcheck','I checked that standards, objectives, instruction, and assessment align.'],['supportcheck','My differentiation and supports address specific learner needs.'],['actionscheck','Teacher and student actions are clear, with 50 or more words in each of the eight required responses.'],['gradecheck','Activities fit the grade level, content, and one instructional period.'],['materialcheck','All required materials, technology, and resources are identified.'],['proofcheck','I carefully proofread the plan for professional writing.'],['classcheck','I started and developed my plan during guided class work under Dr. Spencer.']];
function review(){return heading('REVIEW & TRANSFER','Make your decisions visible.','Use the checks below to revise, then transfer your work into the Standards-Aligned Lesson Plan Template provided in Canvas.')+f('materials','Materials, technology, and resources','List teacher and student materials, texts, manipulatives, handouts, devices, access needs, and sources. Explain an alternative if essential technology is unavailable.')+f('reflection','Planning reflection','Why are your strategies appropriate for these students? Explain how activities support the objective, what evidence will show learning, which barriers you addressed, and how students will actively think.')+f('feedback','Feedback and revision notes','Record feedback received during guided class work, the section revised, and how the change improves the lesson.')+`<div class="tip"><b>Notebook check</b><br>This checks field completion, the eight word minimums, objective-row completeness, self-recorded approval, and time totals. It cannot evaluate the quality of alignment or verify approval or class participation. Review those with Dr. Spencer.</div><div id="audit" aria-live="polite"></div><h3>Final self-check</h3>`+checks.map(x=>ck(...x)).join('')+`<div class="callout"><b>Submit in Canvas:</b> Use the completed Standards-Aligned Lesson Plan Template. This notebook supports planning; your exported responses are working notes to transfer into that template. Approval and guided in-class development remain required.</div>`+end()}
function register(){const hold=current;for(current=0;current<10;current++)content(current);current=hold}
register();
function complete(x){const s=String(data[x.id]||'').trim();return s.length>0&&(!x.min||words(s)>=x.min)}
function update(){const req=fields.filter(x=>x.required),done=req.filter(complete).length;document.getElementById('progressText').textContent=done+' / '+req.length+' required responses complete';const pct=Math.round(done/req.length*100);document.getElementById('progressBar').style.width=pct+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',pct);fields.filter(x=>x.min).forEach(x=>{const c=document.getElementById(x.id+'-count');if(c){const n=words(data[x.id]);c.textContent=n+' / 50 words · '+(n>=50?'minimum met':(50-n)+' more needed');c.classList.toggle('ok',n>=50)}});if(current===9)audit()}
function audit(){const issues=[];if(!data.approved)issues.push([1,'Record Dr. Spencer’s approval before developing the plan.']);fields.filter(x=>x.required&&!complete(x)).forEach(x=>issues.push([x.page,x.label+(x.min?' — '+words(data[x.id])+'/50 words':' — add a response')]));for(let i=2;i<=3;i++){const row=['obj','target','assessment','activity'].map(k=>k+i);if(row.some(k=>String(data[k]||'').trim()))row.filter(k=>!String(data[k]||'').trim()).forEach(k=>issues.push([2,'Complete optional objective '+i+': '+fields.find(x=>x.id===k).label]));}const timeKeys=['openingtime','modeltime','guidedtime','applytime','closuretime'];const raw=[data.duration,...timeKeys.map(k=>data[k])];let time='Add a numeric total and all five phase times to compare your time allocation.';if(raw.every(x=>String(x||'').trim()!==''&&Number.isFinite(Number(x))&&Number(x)>0)){const sum=timeKeys.reduce((a,k)=>a+Number(data[k]),0);time='Planned phases: '+sum+' min · instructional period: '+Number(data.duration)+' min.';if(sum!==Number(data.duration))issues.push([1,'Revise phase times or total lesson time so they match.']);}else if(raw.some(x=>String(x||'').trim()!==''))issues.push([1,'Use positive numbers for total and phase times.']);document.getElementById('audit').innerHTML=`<p><b>${issues.length?issues.length+' planning items to revisit':'Required responses and length checks are complete.'}</b></p><p class="small">${esc(time)}</p>`+issues.map(([p,t])=>`<div class="issue"><button data-jump="${p}">Open ${stages[p][0]}</button>${esc(t)}</div>`).join('');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;document.getElementById('saveStatus').textContent='Draft stored in this browser · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}catch(e){storageOK=false;document.getElementById('saveStatus').textContent='Browser saving is unavailable. Use Save backup to keep your work.'}}
function render(focus=false){document.getElementById('nav').innerHTML=stages.map((s,i)=>`<button data-jump="${i}" ${i===current?'aria-current="step"':''}>${i+1}. ${s[0]}<small>${s[1]}</small></button>`).join('');document.getElementById('page').innerHTML=content(current);document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===9;update();if(!storageOK)document.getElementById('saveStatus').textContent='Browser saving is unavailable. Use Save backup.';if(focus)document.querySelector('h2').focus()}
document.addEventListener('input',e=>{const k=e.target.dataset.field;if(k){data[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();update()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(b){current=Number(b.dataset.jump);render(true)}});document.getElementById('prev').onclick=()=>{if(current>0){current--;render(true)}};document.getElementById('next').onclick=()=>{if(current<9){current++;render(true)}};
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('backup').onclick=()=>{download('ELED_328_Notebook_Backup.json',JSON.stringify({notebook:KEY,responses:data},null,2),'application/json');document.getElementById('saveStatus').textContent='Backup download requested. Keep it in a secure location.'};
document.getElementById('restore').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const b=JSON.parse(await file.text());if(b.notebook!==KEY||!b.responses||typeof b.responses!=='object'||Array.isArray(b.responses))throw Error();if(!confirm('Replace this browser’s current notebook responses with the backup? Save a backup of your current work first if needed.'))return;const allowed=new Set([...fields.map(x=>x.id),...checks.map(x=>x[0]),'approved']);const clean={};for(const [k,v]of Object.entries(b.responses))if(allowed.has(k)&&(typeof v==='string'||typeof v==='boolean'))clean[k]=v;data=clean;save();render();document.getElementById('saveStatus').textContent='Backup opened. Review your restored responses.';}catch(err){document.getElementById('saveStatus').textContent='Could not open this file. Choose an ELED 328 notebook JSON backup.'}finally{e.target.value=''}};
function plain(){let s='ELED 328 — Standards-Aligned Lesson Planning Notebook\nWorking notes: transfer to the Canvas template.\n\n';for(let p=0;p<10;p++){s+='\n'+stages[p].join(' — ')+'\n';if(p===1)s+='Dr. Spencer approval (student record): '+(data.approved?'Recorded':'Not recorded')+'\n';for(const f of fields.filter(x=>x.page===p))s+='\n'+f.label+(f.min?' ['+words(data[f.id])+'/50 words]':'')+'\n'+(data[f.id]||'[No response]')+'\n';}s+='\nFinal self-checks (student record)\n'+checks.map(([id,l])=>(data[id]?'[x] ':'[ ] ')+l).join('\n');return s}
document.getElementById('textExport').onclick=()=>download('ELED_328_Planning_Responses.txt',plain(),'text/plain;charset=utf-8');
function printReady(){let out='<h1>ELED 328 — Lesson Planning Notebook</h1><p>Working notes to transfer to the Canvas lesson plan template. Approval and guided in-class development are required.</p>';for(let p=0;p<10;p++){out+='<section><h2>'+esc(stages[p].join(' — '))+'</h2>';if(p===1)out+='<p>Dr. Spencer approval (student record): '+(data.approved?'Recorded':'Not recorded')+'</p>';for(const f of fields.filter(x=>x.page===p))out+='<h3>'+esc(f.label)+(f.min?' · '+words(data[f.id])+'/50 words':'')+'</h3><p class="answer">'+esc(data[f.id]||'[No response]')+'</p>';out+='</section>'}out+='<h2>Final self-checks (student record)</h2>'+checks.map(([id,l])=>'<p>'+(data[id]?'☑ ':'☐ ')+esc(l)+'</p>').join('');document.getElementById('printout').innerHTML=out}
document.getElementById('print').onclick=()=>{printReady();window.print()};window.addEventListener('beforeprint',printReady);render();
</script></body></html>
